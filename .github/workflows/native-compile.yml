name: Native compilation

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
    secrets:
      HANAFUBUKI_SOURCE_REPOSITORY:
        required: true
      GIT_ED25519_PRIVATE_KEY:
        required: true
      TAURI_UPDATER_PUBLIC_KEY:
        required: false

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.targetTriple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            targetTriple: x86_64-pc-windows-msvc
            binary: hanafubuki.exe
          - platform: macos
            runner: macos-26
            targetTriple: aarch64-apple-darwin
            binary: hanafubuki
          - platform: macos
            runner: macos-26-intel
            targetTriple: x86_64-apple-darwin
            binary: hanafubuki
          - platform: linux
            runner: ubuntu-22.04
            targetTriple: x86_64-unknown-linux-gnu
            binary: hanafubuki
          - platform: linux
            runner: ubuntu-22.04-arm
            targetTriple: aarch64-unknown-linux-gnu
            binary: hanafubuki
    runs-on: ${{ matrix.runner }}
    env:
      CI: "true"
      MICROMAMBA_TARGET_TRIPLE: ${{ matrix.targetTriple }}
      UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Configure Git
        shell: bash
        env:
          DEPLOY_PRI: ${{ secrets.GIT_ED25519_PRIVATE_KEY }}
          GIT_USERNAME: ${{ github.repository_owner }}
          GIT_EMAIL: ${{ github.repository_owner }}@user.github.com
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh/
          printf '%s\n' "${DEPLOY_PRI}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "${GIT_USERNAME}"
          git config --global user.email "${GIT_EMAIL}"
      - name: Checkout source commit
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.HANAFUBUKI_SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_REPOSITORY" && -n "$SOURCE_SHA" ]]
          git clone --filter=blob:none --no-checkout "$SOURCE_REPOSITORY" source
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.96.0"
          target: ${{ matrix.targetTriple }}
      - name: Install Linux compilation prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Create updater configuration
        if: env.UPDATER_PUBLIC_KEY != ''
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          config_path="$RUNNER_TEMP/tauri.updater.conf.json"
          CONFIG_PATH="$config_path" node --input-type=module --eval '
            import { writeFileSync } from "node:fs";
            const pubkey = process.env.UPDATER_PUBLIC_KEY?.trim();
            if (!pubkey) throw new Error("Updater public key must not be empty");
            writeFileSync(
              process.env.CONFIG_PATH,
              `${JSON.stringify({ plugins: { updater: { pubkey } } })}\n`,
              "utf8",
            );
          '
          printf 'TAURI_UPDATER_CONFIG=%s\n' "$config_path" >> "$GITHUB_ENV"
      - name: Compile application
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          args=(
            bun run tauri build --ci
            --target "${{ matrix.targetTriple }}"
            --no-bundle
          )
          if [[ -n "${TAURI_UPDATER_CONFIG:-}" ]]; then
            args+=(--config "$TAURI_UPDATER_CONFIG")
          fi
          args+=(-- --locked)
          "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hanafubuki-compiled-${{ inputs.artifact_prefix }}-${{ matrix.targetTriple }}
          path: source/src-tauri/target/${{ matrix.targetTriple }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1
