name: Hanafubuki development

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Development branch or commit to validate
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: hanafubuki-development-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check and test development repository
    runs-on: ubuntu-22.04
    env:
      CI: "true"
    steps:
      - name: Configure Git
        shell: bash
        env:
          DEPLOY_PRI: ${{ secrets.GIT_ED25519_PRIVATE_KEY }}
          GIT_USERNAME: ${{ github.repository_owner }}
          GIT_EMAIL: ${{ github.repository_owner }}@user.github.com
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh/
          printf '%s\n' "${DEPLOY_PRI}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "${GIT_USERNAME}"
          git config --global user.email "${GIT_EMAIL}"

      - name: Checkout development source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.HANAFUBUKI_SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_REF" || "$SOURCE_REF" == -* ]]; then
            echo "The source repository and a branch or commit source_ref are required." >&2
            exit 1
          fi
          git clone --filter=blob:none --no-checkout "$SOURCE_REPOSITORY" source
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            git -C source fetch --depth=1 origin "$SOURCE_REF"
          else
            git check-ref-format --branch "$SOURCE_REF"
            git -C source fetch --depth=1 origin "refs/heads/$SOURCE_REF"
          fi
          git -C source checkout --detach FETCH_HEAD
          source_sha="$(git -C source rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "Validating development source commit: $source_sha"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.9"
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxkbcommon-dev \
            librsvg2-dev \
            patchelf

      - name: Install locked dependencies
        working-directory: source
        run: |
          bun install --frozen-lockfile
          uv sync --project scripts/release --locked

      - name: Test release tooling
        working-directory: source
        run: uv run --project scripts/release --locked python -m pytest scripts/release/tests

      - name: Check repository
        working-directory: source
        run: bun run check

      - name: Test repository
        working-directory: source
        run: bun run test
