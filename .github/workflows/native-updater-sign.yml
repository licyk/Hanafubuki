name: Native updater signing

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      artifact_channel:
        required: true
        type: string
    secrets:
      HANAFUBUKI_SOURCE_REPOSITORY:
        required: true
      GIT_ED25519_PRIVATE_KEY:
        required: true
      TAURI_UPDATER_PUBLIC_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  sign:
    name: Sign updater artifacts
    runs-on: ubuntu-22.04
    steps:
      - name: Configure Git
        shell: bash
        env:
          DEPLOY_PRI: ${{ secrets.GIT_ED25519_PRIVATE_KEY }}
          GIT_USERNAME: ${{ github.repository_owner }}
          GIT_EMAIL: ${{ github.repository_owner }}@user.github.com
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh/
          printf '%s\n' "${DEPLOY_PRI}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "${GIT_USERNAME}"
          git config --global user.email "${GIT_EMAIL}"
      - name: Checkout source commit
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ secrets.HANAFUBUKI_SOURCE_REPOSITORY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_REPOSITORY" && -n "$SOURCE_SHA" ]]
          git clone --filter=blob:none --no-checkout "$SOURCE_REPOSITORY" source
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hanafubuki-${{ inputs.artifact_channel }}-${{ inputs.artifact_prefix }}-*
          path: source/release-bundles
          merge-multiple: false
      - name: Detect updater signing credentials
        id: updater_signing
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if [[ -n "$UPDATER_PRIVATE_KEY" && -n "$UPDATER_PUBLIC_KEY" ]]; then
            printf 'signed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'signed=false\n' >> "$GITHUB_OUTPUT"
            echo "Updater signing credentials are incomplete; retaining unsigned updater artifacts."
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.updater_signing.outputs.signed == 'true'
        with:
          bun-version: "1.3.13"
      - name: Install updater signer
        if: steps.updater_signing.outputs.signed == 'true'
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Sign updater artifacts
        if: steps.updater_signing.outputs.signed == 'true'
        shell: bash
        working-directory: source
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sign_one() {
            local target="$1"
            local root="release-bundles/hanafubuki-${{ inputs.artifact_channel }}-${{ inputs.artifact_prefix }}-${target}"
            local filename
            filename="$(bun scripts/release/target-manifest.ts updater-path --directory "$root")"
            if [[ "$filename" != "$(basename "$filename")" || ! -s "$root/$filename" ]]; then
              echo "target.json selected an invalid updater artifact for ${target}." >&2
              exit 1
            fi
            bun run tauri signer sign "$root/$filename"
            if [[ ! -s "$root/$filename.sig" ]]; then
              echo "Updater signer did not create a non-empty signature for $filename." >&2
              exit 1
            fi
            bun scripts/release/target-manifest.ts record-signature --directory "$root"
          }

          sign_one x86_64-pc-windows-msvc
          sign_one aarch64-apple-darwin
          sign_one x86_64-apple-darwin
          sign_one x86_64-unknown-linux-gnu
          sign_one aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hanafubuki-${{ inputs.artifact_channel }}-${{ inputs.artifact_prefix }}
          path: source/release-bundles
          if-no-files-found: error
          retention-days: 30
