name: Compile native application
description: Compile one Hanafubuki native target and upload its executable.

inputs:
  platform:
    description: Target platform name.
    required: true
  target_triple:
    description: Rust target triple.
    required: true
  binary:
    description: Compiled executable filename.
    required: true
  artifact_prefix:
    description: Artifact identity shared by the release jobs.
    required: true
  updater_signing_private_key:
    description: Optional Tauri updater signing private key used during compilation.
    required: false

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        toolchain: "1.97.1"
        target: ${{ inputs.target_triple }}
    - name: Install Linux compilation prerequisites
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf
    - name: Install dependencies
      shell: bash
      working-directory: source
      run: bun install --frozen-lockfile
    - name: Compile application
      shell: bash
      working-directory: source
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater_signing_private_key }}
      run: |
        set -euo pipefail
        bun run tauri build --ci \
          --target "${{ inputs.target_triple }}" \
          --no-bundle \
          -- \
          --locked
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: hanafubuki-compiled-${{ inputs.artifact_prefix }}-${{ inputs.target_triple }}
        path: source/src-tauri/target/${{ inputs.target_triple }}/release/${{ inputs.binary }}
        if-no-files-found: error
        retention-days: 1
