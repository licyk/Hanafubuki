name: Compile native application
description: Compile one Hanafubuki native target and upload its executable.

inputs:
  platform:
    description: Target platform name.
    required: true
  target_triple:
    description: Rust target triple.
    required: true
  binary:
    description: Compiled executable filename.
    required: true
  version:
    description: Validated Hanafubuki release version.
    required: true
  updater_signing_private_key:
    description: Optional Tauri updater signing private key used during compilation.
    required: false

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: source/package.json
    - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        rust-src-dir: source
        target: ${{ inputs.target_triple }}
    - name: Install Linux compilation prerequisites
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf
    - name: Install dependencies
      shell: bash
      working-directory: source
      run: bun install --frozen-lockfile
    - name: Compile application
      shell: bash
      working-directory: source
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater_signing_private_key }}
      run: |
        set -euo pipefail
        bun run tauri build --ci \
          --target "${{ inputs.target_triple }}" \
          --no-bundle \
          -- \
          --locked
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: hanafubuki-compiled-${{ inputs.version }}-${{ inputs.target_triple }}
        path: source/src-tauri/target/${{ inputs.target_triple }}/release/${{ inputs.binary }}
        if-no-files-found: error
        retention-days: 1
