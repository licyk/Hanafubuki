name: Sign updater artifacts
description: Optionally sign and aggregate the updater artifacts for all native targets.

inputs:
  version:
    description: Validated Hanafubuki release version.
    required: true
  updater_signing_private_key:
    description: Optional Tauri updater signing private key.
    required: false
  updater_signing_private_key_password:
    description: Optional Tauri updater signing key password.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: hanafubuki-release-${{ inputs.version }}-*
        path: source/release-bundles
        merge-multiple: false
    - name: Detect updater signing credentials
      id: updater_signing
      shell: bash
      env:
        UPDATER_PRIVATE_KEY: ${{ inputs.updater_signing_private_key }}
      run: |
        if [[ -n "$UPDATER_PRIVATE_KEY" ]]; then
          printf 'signed=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'signed=false\n' >> "$GITHUB_OUTPUT"
          echo "Updater signing private key is missing; retaining unsigned updater artifacts."
        fi
    - uses: oven-sh/setup-bun@v2
      if: steps.updater_signing.outputs.signed == 'true'
      with:
        bun-version: "1.3.14"
    - name: Install updater signer
      if: steps.updater_signing.outputs.signed == 'true'
      shell: bash
      working-directory: source
      run: bun install --frozen-lockfile
    - name: Sign updater artifacts
      if: steps.updater_signing.outputs.signed == 'true'
      shell: bash
      working-directory: source
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater_signing_private_key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater_signing_private_key_password }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        found=false
        roots=(release-bundles/hanafubuki-release-${{ inputs.version }}-*)
        for root in "${roots[@]}"; do
          found=true
          target="$(basename "$root")"
          filename="$(bun scripts/release/target-manifest.ts updater-path --directory "$root")"
          if [[ "$filename" != "$(basename "$filename")" || ! -s "$root/$filename" ]]; then
            echo "target.json selected an invalid updater artifact for ${target}." >&2
            exit 1
          fi
          bun run tauri signer sign "$root/$filename"
          if [[ ! -s "$root/$filename.sig" ]]; then
            echo "Updater signer did not create a non-empty signature for $filename." >&2
            exit 1
          fi
        done
        if [[ "$found" != "true" ]]; then
          echo "No target handoffs were downloaded for updater signing." >&2
          exit 1
        fi
    - uses: actions/upload-artifact@v7
      with:
        name: hanafubuki-release-${{ inputs.version }}
        path: source/release-bundles
        if-no-files-found: error
        retention-days: 30
