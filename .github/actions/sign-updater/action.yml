name: Sign updater artifacts
description: Optionally sign and aggregate the updater artifacts for all native targets.

inputs:
  artifact_prefix:
    description: Artifact identity shared by the release jobs.
    required: true
  artifact_channel:
    description: Artifact channel, either release or packages.
    required: true
  updater_signing_private_key:
    description: Optional Tauri updater signing private key.
    required: false
  updater_signing_private_key_password:
    description: Optional Tauri updater signing key password.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: hanafubuki-${{ inputs.artifact_channel }}-${{ inputs.artifact_prefix }}-*
        path: source/release-bundles
        merge-multiple: false
    - name: Detect updater signing credentials
      id: updater_signing
      shell: bash
      env:
        UPDATER_PRIVATE_KEY: ${{ inputs.updater_signing_private_key }}
      run: |
        if [[ -n "$UPDATER_PRIVATE_KEY" ]]; then
          printf 'signed=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'signed=false\n' >> "$GITHUB_OUTPUT"
          echo "Updater signing private key is missing; retaining unsigned updater artifacts."
        fi
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: steps.updater_signing.outputs.signed == 'true'
      with:
        bun-version: "1.3.14"
    - name: Install updater signer
      if: steps.updater_signing.outputs.signed == 'true'
      shell: bash
      working-directory: source
      run: bun install --frozen-lockfile
    - name: Sign updater artifacts
      if: steps.updater_signing.outputs.signed == 'true'
      shell: bash
      working-directory: source
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater_signing_private_key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater_signing_private_key_password }}
      run: |
        set -euo pipefail
        sign_one() {
          local target="$1"
          local root="release-bundles/hanafubuki-${{ inputs.artifact_channel }}-${{ inputs.artifact_prefix }}-${target}"
          local filename
          filename="$(bun scripts/release/target-manifest.ts updater-path --directory "$root")"
          if [[ "$filename" != "$(basename "$filename")" || ! -s "$root/$filename" ]]; then
            echo "target.json selected an invalid updater artifact for ${target}." >&2
            exit 1
          fi
          bun run tauri signer sign "$root/$filename"
          if [[ ! -s "$root/$filename.sig" ]]; then
            echo "Updater signer did not create a non-empty signature for $filename." >&2
            exit 1
          fi
          bun scripts/release/target-manifest.ts record-signature --directory "$root"
        }

        sign_one x86_64-pc-windows-msvc
        sign_one aarch64-apple-darwin
        sign_one x86_64-apple-darwin
        sign_one x86_64-unknown-linux-gnu
        sign_one aarch64-unknown-linux-gnu
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: hanafubuki-${{ inputs.artifact_channel }}-${{ inputs.artifact_prefix }}
        path: source/release-bundles
        if-no-files-found: error
        retention-days: 30
