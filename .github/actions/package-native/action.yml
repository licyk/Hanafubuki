name: Package native application
description: Bundle, optionally platform-sign, normalize, and upload one native target.

inputs:
  platform:
    description: Target platform name.
    required: true
  architecture:
    description: Target architecture name.
    required: true
  target_triple:
    description: Rust target triple.
    required: true
  bundles:
    description: Comma-separated Tauri bundle kinds.
    required: true
  binary:
    description: Compiled executable filename.
    required: true
  updater_kind:
    description: Artifact kind selected for updater signing.
    required: true
  artifact_prefix:
    description: Artifact identity shared by the release jobs.
    required: true
  artifact_channel:
    description: Artifact channel, either release or packages.
    required: true
  windows_certificate:
    description: Optional base64-encoded Windows signing certificate.
    required: false
  windows_certificate_password:
    description: Optional Windows signing certificate password.
    required: false
  apple_certificate:
    description: Optional base64-encoded Apple signing certificate.
    required: false
  apple_certificate_password:
    description: Optional Apple signing certificate password.
    required: false
  keychain_password:
    description: Optional temporary Apple keychain password.
    required: false
  apple_id:
    description: Optional Apple notarization account.
    required: false
  apple_password:
    description: Optional Apple notarization app password.
    required: false
  apple_team_id:
    description: Optional Apple developer team identifier.
    required: false

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: "1.97.1"
        target: ${{ inputs.target_triple }}
    - name: Install Linux bundling prerequisites
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          libfuse2 \
          rpm \
          xdg-utils
    - name: Install dependencies
      shell: bash
      working-directory: source
      run: bun install --frozen-lockfile
    - uses: actions/download-artifact@v8
      with:
        name: hanafubuki-compiled-${{ inputs.artifact_prefix }}-${{ inputs.target_triple }}
        path: source/src-tauri/target/${{ inputs.target_triple }}/release
    - name: Restore executable permission
      if: inputs.platform != 'windows'
      shell: bash
      working-directory: source
      run: chmod +x "src-tauri/target/${{ inputs.target_triple }}/release/${{ inputs.binary }}"
    - name: Prepare bundled assets
      shell: bash
      working-directory: source
      run: bun run prepare:assets
    - name: Detect Windows platform signing credentials
      id: windows_platform_signing
      if: inputs.platform == 'windows'
      shell: bash
      env:
        WINDOWS_CERTIFICATE: ${{ inputs.windows_certificate }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.windows_certificate_password }}
      run: |
        if [[ -n "$WINDOWS_CERTIFICATE" && -n "$WINDOWS_CERTIFICATE_PASSWORD" ]]; then
          printf 'signed=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'signed=false\n' >> "$GITHUB_OUTPUT"
          echo "Windows Authenticode credentials are incomplete; skipping platform signing."
        fi
    - name: Detect macOS platform signing credentials
      id: macos_platform_signing
      if: inputs.platform == 'macos'
      shell: bash
      env:
        APPLE_CERTIFICATE: ${{ inputs.apple_certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple_certificate_password }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain_password }}
        APPLE_ID: ${{ inputs.apple_id }}
        APPLE_PASSWORD: ${{ inputs.apple_password }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
      run: |
        if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$KEYCHAIN_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
          printf 'signed=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'signed=false\n' >> "$GITHUB_OUTPUT"
          echo "macOS signing credentials are incomplete; skipping platform signing."
        fi
    - name: Resolve platform signing mode
      id: platform_signing
      shell: bash
      env:
        WINDOWS_SIGNED: ${{ steps.windows_platform_signing.outputs.signed }}
        MACOS_SIGNED: ${{ steps.macos_platform_signing.outputs.signed }}
      run: |
        if [[ "$WINDOWS_SIGNED" == "true" || "$MACOS_SIGNED" == "true" ]]; then
          printf 'signed=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'signed=false\n' >> "$GITHUB_OUTPUT"
        fi
    - name: Import Windows signing certificate
      if: inputs.platform == 'windows' && steps.platform_signing.outputs.signed == 'true'
      shell: pwsh
      env:
        WINDOWS_CERTIFICATE: ${{ inputs.windows_certificate }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.windows_certificate_password }}
      run: |
        $ErrorActionPreference = "Stop"
        $certificatePath = Join-Path $env:RUNNER_TEMP "hanafubuki-certificate.pfx"
        [IO.File]::WriteAllBytes(
          $certificatePath,
          [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
        )
        try {
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
        } finally {
          Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
        }
        if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
          throw "The Windows code-signing certificate could not be imported"
        }
        $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows.conf.json"
        @{
          bundle = @{
            windows = @{
              certificateThumbprint = $certificate.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
            }
          }
        } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $configPath
        "TAURI_PLATFORM_CONFIG=$configPath" >> $env:GITHUB_ENV
    - name: Import Apple signing certificate
      if: inputs.platform == 'macos' && steps.platform_signing.outputs.signed == 'true'
      shell: bash
      env:
        APPLE_CERTIFICATE: ${{ inputs.apple_certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple_certificate_password }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain_password }}
      run: |
        set -euo pipefail
        certificate_path="$RUNNER_TEMP/hanafubuki-certificate.p12"
        keychain_path="$RUNNER_TEMP/hanafubuki-build.keychain-db"
        printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
        security set-keychain-settings -lut 21600 "$keychain_path"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
        security import "$certificate_path" \
          -P "$APPLE_CERTIFICATE_PASSWORD" \
          -A \
          -t cert \
          -f pkcs12 \
          -k "$keychain_path"
        rm -f "$certificate_path"
        security list-keychain -d user -s "$keychain_path"
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s \
          -k "$KEYCHAIN_PASSWORD" \
          "$keychain_path"
        identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n '1s/.*"\(.*\)".*/\1/p')"
        if [[ -z "$identity" ]]; then
          echo "No Apple code-signing identity was imported." >&2
          exit 1
        fi
        printf 'APPLE_SIGNING_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
    - name: Bundle packages
      shell: bash
      working-directory: source
      env:
        PLATFORM_SIGNED: ${{ steps.platform_signing.outputs.signed }}
        APPLE_ID: ${{ inputs.apple_id }}
        APPLE_PASSWORD: ${{ inputs.apple_password }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
      run: |
        set -euo pipefail
        args=(
          bun run tauri bundle --ci
          --target "${{ inputs.target_triple }}"
          --bundles "${{ inputs.bundles }}"
        )
        if [[ -n "${TAURI_PLATFORM_CONFIG:-}" ]]; then
          args+=(--config "$TAURI_PLATFORM_CONFIG")
        fi
        if [[ "$PLATFORM_SIGNED" != "true" ]]; then
          args+=(--no-sign)
        fi
        "${args[@]}"
    - name: Ensure macOS updater archive
      if: inputs.platform == 'macos'
      shell: bash
      working-directory: source
      run: |
        set -euo pipefail
        macos_root="src-tauri/target/${{ inputs.target_triple }}/release/bundle/macos"
        shopt -s nullglob
        apps=("$macos_root"/*.app)
        archives=("$macos_root"/*.app.tar.gz)
        shopt -u nullglob
        if [[ "${#apps[@]}" -ne 1 ]]; then
          echo "Expected exactly one macOS app bundle, found ${#apps[@]}." >&2
          exit 1
        fi
        if [[ "${#archives[@]}" -gt 1 ]]; then
          echo "Expected at most one macOS updater archive, found ${#archives[@]}." >&2
          exit 1
        fi
        if [[ "${#archives[@]}" -eq 0 ]]; then
          app_name="$(basename "${apps[0]}")"
          COPYFILE_DISABLE=1 tar -czf "$macos_root/${app_name}.tar.gz" \
            -C "$macos_root" \
            "$app_name"
        fi
        archives=("$macos_root"/*.app.tar.gz)
        [[ "${#archives[@]}" -eq 1 && -s "${archives[0]}" ]]
    - name: Build Windows portable archive
      if: inputs.platform == 'windows'
      shell: pwsh
      working-directory: source
      run: |
        $ErrorActionPreference = "Stop"
        $releaseRoot = "src-tauri/target/${{ inputs.target_triple }}/release"
        $archiveRoot = Join-Path $env:RUNNER_TEMP "hanafubuki-portable"
        $applicationRoot = Join-Path $archiveRoot "Hanafubuki"
        $generatedRoot = Join-Path $applicationRoot "generated"
        New-Item -ItemType Directory -Path $generatedRoot | Out-Null
        Copy-Item "$releaseRoot/${{ inputs.binary }}" (Join-Path $applicationRoot "Hanafubuki.exe")
        foreach ($resource in @("python-assets", "python-bootstrap", "micromamba")) {
          Copy-Item "src-tauri/generated/$resource" (Join-Path $generatedRoot $resource) -Recurse
        }
        $portableDirectory = Join-Path $releaseRoot "bundle/portable"
        New-Item -ItemType Directory -Path $portableDirectory | Out-Null
        $archive = Join-Path $portableDirectory "Hanafubuki-portable.zip"
        & tar.exe -a -c -f $archive -C $archiveRoot Hanafubuki
        if ($LASTEXITCODE -ne 0 -or !(Test-Path $archive) -or (Get-Item $archive).Length -le 0) {
          throw "Windows portable archive creation failed"
        }
    - name: Verify Windows signatures
      if: inputs.platform == 'windows' && steps.platform_signing.outputs.signed == 'true'
      shell: pwsh
      working-directory: source
      run: |
        $ErrorActionPreference = "Stop"
        $bundleRoot = "src-tauri/target/${{ inputs.target_triple }}/release/bundle"
        $installers = @(
          Get-ChildItem $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") }
        )
        if ($installers.Count -ne 2) {
          throw "Expected one NSIS installer and one MSI installer"
        }
        foreach ($installer in $installers) {
          & signtool.exe verify /pa /all $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode verification failed for $($installer.Name)"
          }
        }
        $archives = @(Get-ChildItem "$bundleRoot/portable" -File -Filter "*.zip")
        if ($archives.Count -ne 1) {
          throw "Expected exactly one Windows portable archive"
        }
        $inspectionRoot = Join-Path $env:RUNNER_TEMP "hanafubuki-portable-signature"
        Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $inspectionRoot
        $portableExecutable = Join-Path $inspectionRoot "Hanafubuki/Hanafubuki.exe"
        & signtool.exe verify /pa /all $portableExecutable
        if ($LASTEXITCODE -ne 0) {
          throw "Authenticode verification failed for the portable executable"
        }
    - name: Verify macOS signing and notarization
      if: inputs.platform == 'macos' && steps.platform_signing.outputs.signed == 'true'
      shell: bash
      working-directory: source
      run: |
        set -euo pipefail
        bundle_root="src-tauri/target/${{ inputs.target_triple }}/release/bundle"
        app="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
        dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
        [[ -n "$app" && -n "$dmg" ]]
        codesign --verify --deep --strict --verbose=2 "$app"
        xcrun stapler validate "$app"
        xcrun stapler validate "$dmg"
    - name: Normalize target handoff
      shell: bash
      working-directory: source
      run: |
        set -euo pipefail
        bundle_root="src-tauri/target/${{ inputs.target_triple }}/release/bundle"
        target_root="$RUNNER_TEMP/hanafubuki-target-${{ inputs.target_triple }}"
        version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')"
        single_file() {
          local directory="$1"
          local pattern="$2"
          local matches=()
          while IFS= read -r -d '' path; do matches+=("$path"); done < <(
            find "$directory" -maxdepth 1 -type f -name "$pattern" -print0
          )
          if [[ "${#matches[@]}" -ne 1 || ! -s "${matches[0]}" ]]; then
            echo "Expected one non-empty $pattern in $directory, found ${#matches[@]}." >&2
            exit 1
          fi
          printf '%s\n' "${matches[0]}"
        }

        sources=()
        if [[ "${{ inputs.platform }}" == "windows" ]]; then
          sources+=(--source "nsis=$(single_file "$bundle_root/nsis" '*.exe')")
          sources+=(--source "msi=$(single_file "$bundle_root/msi" '*.msi')")
          sources+=(--source "portable-zip=$(single_file "$bundle_root/portable" '*.zip')")
        elif [[ "${{ inputs.platform }}" == "macos" ]]; then
          sources+=(--source "dmg=$(single_file "$bundle_root/dmg" '*.dmg')")
          sources+=(--source "app-tar-gz=$(single_file "$bundle_root/macos" '*.app.tar.gz')")
        else
          sources+=(--source "appimage=$(single_file "$bundle_root/appimage" '*.AppImage')")
          sources+=(--source "deb=$(single_file "$bundle_root/deb" '*.deb')")
          sources+=(--source "rpm=$(single_file "$bundle_root/rpm" '*.rpm')")
        fi
        bun scripts/release/target-manifest.ts create \
          --directory "$target_root" \
          --version "$version" \
          --target-triple "${{ inputs.target_triple }}" \
          --platform "${{ inputs.platform }}" \
          --architecture "${{ inputs.architecture }}" \
          --updater-kind "${{ inputs.updater_kind }}" \
          "${sources[@]}"
    - uses: actions/upload-artifact@v7
      with:
        name: hanafubuki-${{ inputs.artifact_channel }}-${{ inputs.artifact_prefix }}-${{ inputs.target_triple }}
        path: ${{ runner.temp }}/hanafubuki-target-${{ inputs.target_triple }}
        if-no-files-found: error
        retention-days: 1
